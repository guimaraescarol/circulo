<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Mensagens</title>
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
  <style>
    .hit::after { content: ''; position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body { margin: 0; background: var(--t-bg,#000000); color: var(--t-text,#ECEDEE); font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    .ms-title { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; letter-spacing: -0.01em; }
    .ms-clamp1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 776px; overflow: hidden; background: var(--t-bg,#000000); display: flex; flex-direction: column;">

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px;">
    <button class="hit" type="button" onClick="{{goBack}}" aria-label="Voltar" style="position: relative; width: 38px; height: 38px; padding: 0; border: none; border-radius: 12px; background: var(--t-card2,#212124); color: var(--t-text,#ECEDEE); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
      <div class="ms-title" style="font-size: 22px; font-weight: 700; line-height: 1.15;">Mensagens</div>
      <div style="font-size: 11.5px; color: var(--t-muted,#A1A1AA);">{{summary}}</div>
    </div>
    <button type="button" onClick="{{openCompose}}" aria-label="Escrever nova mensagem" style="width: 44px; height: 44px; padding: 0; border: none; border-radius: 14px; background: #006FEE; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
    </button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding-bottom: 24px;">

    <div style="padding: 4px 16px 6px;">
      <label style="height: 44px; border-radius: 12px; background: var(--t-card,#18181B); border: 1px solid rgba(var(--t-ink,255,255,255),0.1); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--t-muted,#A1A1AA);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Buscar conversas" aria-label="Buscar conversas" style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; color: var(--t-text,#ECEDEE); font-family: inherit; font-size: 14px;">
        <sc-if value="{{hasQuery}}" hint-placeholder-val="{{false}}">
          <button class="hit" type="button" onClick="{{clearQuery}}" aria-label="Limpar busca" style="position: relative; flex: none; width: 24px; height: 24px; padding: 0; border: none; border-radius: 999px; background: var(--t-card3,#2A2A2E); color: var(--t-text,#ECEDEE); cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </sc-if>
      </label>
    </div>

    <sc-if value="{{showRoomCard}}" hint-placeholder-val="{{true}}">
    <button type="button" onClick="{{openMyRoom}}" aria-label="Entrar no meu quarto" style="width: calc(100% - 32px); margin: 6px 16px 0; padding: 8px 12px 8px 8px; border-radius: 16px; border: 1px solid rgba(var(--t-ink,255,255,255),0.1); background: var(--t-card,#18181B); color: var(--t-text,#ECEDEE); display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; font-family: inherit;">
      <span style="width: 92px; height: 72px; border-radius: 11px; background: var(--t-bg2,#0E0E12); overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center;"><img src="{{roomImg}}" alt="" width="87" height="76" style="width: 87px; height: 76px; image-rendering: pixelated; display: block;"></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 3px;">
        <span style="max-width: 100%; font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{roomTitle}}</span>
        <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--t-muted,#A1A1AA); white-space: nowrap;">
          <sc-if value="{{roomPrivate}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
          <sc-if value="{{roomOpenFlag}}" hint-placeholder-val="{{true}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></sc-if>
          {{roomPrivacy}}
        </span>
        <span style="max-width: 100%; font-size: 12px; color: var(--t-muted,#A1A1AA); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{roomMeta}}</span>
      </span>
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #006FEE; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
    </button>
    </sc-if>

    <div style="display: flex; gap: 8px; padding: 16px 16px 4px;">
      <sc-for list="{{filterChips}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.onClick}}" style="{{c.style}}">{{c.label}}<span style="margin-left: 6px; opacity: .85;">{{c.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; padding: 0 16px;">
      <sc-if value="{{showSquads}}" hint-placeholder-val="{{false}}">
        <div style="padding: 10px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--t-muted2,#8E8E99);">Squads</div>
        <sc-for list="{{squadRows}}" as="q" hint-placeholder-count="2">
          <button type="button" onClick="{{q.onOpen}}" style="width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid rgba(var(--t-ink,255,255,255),0.06); background: transparent; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px;">
            <div style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 13px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: var(--t-muted,#A1A1AA); {{q.coverStyle}}">{{q.initial}}</div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <div style="display: flex; align-items: center; gap: 6px;">
                <span class="ms-clamp1" style="font-size: 14.5px; font-weight: {{q.nameWeight}}; min-width: 0;">{{q.name}}</span>
                <span style="flex-shrink: 0; height: 17px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; background: rgba(147,83,211,0.2); color: #D2B4FF;">{{q.memberLabel}}</span>
                <span style="flex: 1;"></span>
                <span style="flex-shrink: 0; font-size: 11px; color: {{q.whenColor}};">{{q.when}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="ms-clamp1" style="flex: 1; min-width: 0; font-size: 13px; font-weight: {{q.previewWeight}}; color: {{q.previewColor}};">{{q.preview}}</span>
                <sc-if value="{{q.hasUnread}}" hint-placeholder-val="{{false}}">
                  <span style="flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #006FEE; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{q.unreadCount}}</span>
                </sc-if>
              </div>
            </div>
          </button>
        </sc-for>
      </sc-if>
      <sc-if value="{{showRowsHeader}}" hint-placeholder-val="{{false}}">
        <div style="padding: 16px 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--t-muted2,#8E8E99);">Conversas</div>
      </sc-if>
      <sc-if value="{{noRows}}" hint-placeholder-val="{{false}}">
        <div style="padding: 48px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="width: 54px; height: 54px; border-radius: 16px; background: var(--t-card,#18181B); display: flex; align-items: center; justify-content: center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--t-faint,#71717A)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7Z"></path></svg>
          </span>
          <div style="font-size: 15px; font-weight: 700;">{{emptyTitle}}</div>
          <div style="font-size: 12.5px; line-height: 1.5; color: var(--t-muted2,#8E8E99);">{{emptyText}}</div>
        </div>
      </sc-if>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" onClick="{{r.onOpen}}" style="width: 100%; padding: 12px 0; border: none; border-bottom: 1px solid rgba(var(--t-ink,255,255,255),0.06); background: transparent; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 12px;">
          <div style="position: relative; flex-shrink: 0; width: 48px; height: 48px;">
            <sc-if value="{{r.is24}}" hint-placeholder-val="{{true}}">
              <svg width="48" height="48" viewBox="0 0 24 24" shape-rendering="crispEdges" style="display: block; border-radius: 13px;">
                <rect x="0" y="0" width="24" height="24" fill="{{r.pix.bg}}"></rect>
                <rect x="4" y="2" width="16" height="8" fill="{{r.pix.body}}"></rect>
                <rect x="0" y="6" width="4" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="20" y="6" width="4" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="6" y="8" width="12" height="10" fill="{{r.pix.body}}"></rect>
                <rect x="8" y="12" width="3" height="3" fill="{{r.pix.accent}}"></rect>
                <rect x="13" y="12" width="3" height="3" fill="{{r.pix.accent}}"></rect>
                <rect x="9" y="17" width="6" height="2" fill="{{r.pix.accent}}"></rect>
              <image href="{{r.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
            </sc-if>
            <sc-if value="{{r.is8}}" hint-placeholder-val="{{false}}">
              <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges" style="display: block; border-radius: 13px;">
                <rect width="8" height="8" fill="{{r.av.bg}}"></rect><rect x="1" y="1" width="6" height="6" fill="{{r.av.body}}"></rect><rect x="1" y="1" width="1" height="1" fill="{{r.av.bg}}"></rect><rect x="6" y="6" width="1" height="1" fill="{{r.av.bg}}"></rect><rect x="2.5" y="3.5" width="1" height="1" fill="{{r.av.light}}"></rect><rect x="4.5" y="3.5" width="1" height="1" fill="{{r.av.light}}"></rect><rect x="3" y="5.5" width="2" height="0.6" fill="{{r.av.bg}}"></rect><rect x="3.5" y="0" width="1" height="1" fill="{{r.av.light}}"></rect>
              <image href="{{r.avUri}}" x="0" y="0" width="8" height="8"></image></svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="ms-clamp1" style="font-size: 14.5px; font-weight: {{r.nameWeight}}; min-width: 0;">{{r.name}}</span>
              <sc-if value="{{r.showKind}}" hint-placeholder-val="{{false}}">
                <span style="flex-shrink: 0; height: 17px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; background: {{r.kindBg}}; color: {{r.kindColor}};">{{r.kindLabel}}</span>
              </sc-if>
              <span style="flex: 1;"></span>
              <span style="flex-shrink: 0; font-size: 11px; color: {{r.whenColor}};">{{r.when}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span class="ms-clamp1" style="flex: 1; min-width: 0; font-size: 13px; font-weight: {{r.previewWeight}}; color: {{r.previewColor}};">{{r.preview}}</span>
              <sc-if value="{{r.hasUnread}}" hint-placeholder-val="{{false}}">
                <span style="flex-shrink: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #006FEE; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{r.unreadCount}}</span>
              </sc-if>
            </div>
          </div>
        </button>
      </sc-for>
    </div>

  </div>

  <sc-if value="{{composeOpen}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-label="Nova mensagem" style="position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; justify-content: flex-end;">
      <button type="button" onClick="{{closeCompose}}" aria-label="Fechar" style="position: absolute; inset: 0; border: none; padding: 0; background: rgba(0,0,0,0.62); cursor: default;"></button>
      <div style="position: relative; height: 640px; max-height: 94%; background: var(--t-bg2,#111113); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; box-shadow: 0 -1px 0 rgba(var(--t-ink,255,255,255),0.08);">
        <div style="flex: none; display: flex; justify-content: center; padding-top: 10px;"><div style="width: 34px; height: 4px; border-radius: 999px; background: rgba(var(--t-ink,255,255,255),0.16);"></div></div>
        <div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px;">
          <span class="ms-title" style="font-size: 18px; font-weight: 700;">Nova mensagem</span>
          <button class="hit" type="button" onClick="{{closeCompose}}" aria-label="Fechar" style="position: relative; width: 38px; height: 38px; margin-right: -6px; padding: 0; border: none; border-radius: 12px; background: transparent; color: var(--t-text,#ECEDEE); cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
        </div>
        <div style="flex: none; padding: 4px 16px 8px;">
          <label style="height: 44px; border-radius: 12px; background: var(--t-card,#18181B); border: 1px solid rgba(var(--t-ink,255,255,255),0.1); display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--t-muted,#A1A1AA);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <input type="search" value="{{fQuery}}" onInput="{{onFQuery}}" placeholder="Buscar amigo pelo nome" aria-label="Buscar amigo" style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; color: var(--t-text,#ECEDEE); font-family: inherit; font-size: 14px;">
          </label>
        </div>
        <div style="flex: none; padding: 4px 16px 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--t-muted2,#8E8E99);">{{friendsHeader}}</div>
        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px;">
          <sc-for list="{{composeRows}}" as="f" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(var(--t-ink,255,255,255),0.06);">
              <button type="button" onClick="{{f.onChat}}" aria-label="Conversar com {{f.name}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: none; background: transparent; color: inherit; font-family: inherit; text-align: left; cursor: pointer;">
                <svg width="44" height="44" viewBox="0 0 24 24" shape-rendering="crispEdges" style="flex: none; display: block; border-radius: 12px;">
                  <rect x="0" y="0" width="24" height="24" fill="{{f.pix.bg}}"></rect>
                  <rect x="4" y="2" width="16" height="8" fill="{{f.pix.body}}"></rect>
                  <rect x="0" y="6" width="4" height="10" fill="{{f.pix.body}}"></rect>
                  <rect x="20" y="6" width="4" height="10" fill="{{f.pix.body}}"></rect>
                  <rect x="6" y="8" width="12" height="10" fill="{{f.pix.body}}"></rect>
                  <rect x="8" y="12" width="3" height="3" fill="{{f.pix.accent}}"></rect>
                  <rect x="13" y="12" width="3" height="3" fill="{{f.pix.accent}}"></rect>
                  <rect x="9" y="17" width="6" height="2" fill="{{f.pix.accent}}"></rect>
                <image href="{{f.avUri}}" x="0" y="0" width="24" height="24"></image></svg>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;"><span class="ms-clamp1" style="font-size: 14.5px; font-weight: 700;">{{f.name}}</span><span class="ms-clamp1" style="font-size: 12px; color: var(--t-muted2,#8E8E99);">{{f.handle}}</span></span>
              </button>
              <button class="hit" type="button" onClick="{{f.onVisit}}" aria-label="Visitar o quarto de {{f.name}}" style="position: relative; flex: none; height: 36px; padding: 0 12px 0 10px; border: none; border-radius: 999px; background: var(--t-card2,#212124); color: var(--t-text,#ECEDEE); font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
                Quarto
              </button>
            </div>
          </sc-for>
          <sc-if value="{{noCompose}}" hint-placeholder-val="{{false}}">
            <div style="padding: 36px 8px; text-align: center; font-size: 13.5px; line-height: 1.45; color: var(--t-muted2,#8E8E99);">{{noComposeText}}</div>
          </sc-if>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{setOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end;">
      <button type="button" onClick="{{closeSettings}}" aria-label="Fechar" style="position: absolute; inset: 0; border: none; padding: 0; background: rgba(0,0,0,0.62); cursor: default;"></button>
      <div role="dialog" aria-modal="true" aria-labelledby="ms-pres-title" style="position: relative; padding: 18px 20px 28px; border-radius: 24px 24px 0 0; background: var(--t-card,#18181B); border-top: 1px solid rgba(var(--t-ink,255,255,255),0.1); display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
          <div id="ms-pres-title" style="font-size: 16px; font-weight: 700;">Privacidade e presença</div>
          <button type="button" onClick="{{closeSettings}}" aria-label="Fechar" style="width: 44px; height: 44px; margin: -8px -10px -8px 0; padding: 0; border: none; background: transparent; color: var(--t-text,#ECEDEE); cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
        </div>
        <div role="radiogroup" aria-label="Status de presença" style="display: flex; flex-direction: column;">
          <sc-for list="{{presenceOpts}}" as="o" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="width: 100%; min-height: 64px; padding: 10px 0; border: none; background: transparent; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 14px;">
              <span style="flex: none; width: 22px; height: 22px; margin-top: 0; display: flex; align-items: center; justify-content: center;"><sc-if value="{{o.isOnline}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="#17C964"></circle></svg></sc-if><sc-if value="{{o.isBusy}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="7" fill="var(--t-amber2,#F5A524)"></circle><rect x="6" y="8.8" width="8" height="2.4" rx="1.2" fill="var(--t-bg2,#09090B)"></rect></svg></sc-if><sc-if value="{{o.isInvis}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true" style="display: block;"><circle cx="10" cy="10" r="5.6" fill="none" stroke="var(--t-faint,#71717A)" stroke-width="2.6"></circle></svg></sc-if></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;">{{o.label}}<sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--t-text,#ECEDEE)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
                <span style="font-size: 12.5px; line-height: 1.45; color: var(--t-muted,#A1A1AA);">{{o.desc}}</span>
              </span>
            </button>
          </sc-for>
        </div>
        <p style="margin: 8px 0 0; font-size: 12px; line-height: 1.5; color: var(--t-muted2,#8A8A94);">As mensagens mostram apenas envio e recebimento. Ninguém vê se você visualizou.</p>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"conversations":{"editor":null},"squads":{"editor":null},"starters":{"editor":null},"friendsList":{"editor":null},"roomInfo":{"editor":null},"openMyRoom":{"editor":null},"back":{"editor":null},"presence":{"editor":null},"setPresence":{"editor":null},"initialFilter":{"editor":null},"$preview":{"width":390,"height":776}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: props.initialFilter || 'todas', setOpen: false, composeOpen: false, fQuery: '', query: '' };
  }

  renderVals() {
    const qn = String(this.state.query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    const hit = (x) => !qn || String((x.name || '') + ' ' + (x.preview || '')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').indexOf(qn) >= 0;
    const all = (this.props.conversations || []).filter(hit);
    const filter = this.state.filter;
    const matches = all.filter((c) => c.kind === 'match');
    const friends = all.filter((c) => c.kind === 'friend');
    const squads = (this.props.squads || []).filter(hit).map((q) => Object.assign({}, q, {
      nameWeight: q.hasUnread ? 700 : 600,
      previewWeight: q.hasUnread ? 600 : 500,
      previewColor: q.hasUnread ? 'var(--t-text,#ECEDEE)' : 'var(--t-muted,#A1A1AA)',
      whenColor: q.hasUnread ? 'var(--t-accsoft,#8FC7FF)' : 'var(--t-faint,#71717A)',
      memberLabel: 'Squad · ' + q.memberCount
    }));
    const rows = filter === 'squads' ? [] : (filter === 'amigos' ? friends : (filter === 'matches' ? matches : all));
    const showSquads = (filter === 'todas' || filter === 'squads') && squads.length > 0;
    const visible = (showSquads ? squads.length : 0) + rows.length;
    const unreadTotal = all.reduce((n, c) => n + (c.hasUnread ? 1 : 0), 0) + squads.reduce((n, q) => n + (q.hasUnread ? 1 : 0), 0);
    const chip = (id, label, count) => ({
      label: label, count: count,
      style: 'flex-shrink: 0; height: 32px; padding: 0 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid ' + (filter === id ? '#006FEE' : 'rgba(var(--t-ink,255,255,255),0.12)') + '; background: ' + (filter === id ? 'rgba(0,111,238,0.18)' : 'var(--t-card,#18181B)') + '; color: ' + (filter === id ? 'var(--t-accsoft,#8FC7FF)' : 'var(--t-sec,#D4D4D8)') + ';',
      onClick: () => this.setState({ filter: id })
    });
    const starters = this.props.starters || [];
    const empties = {
      todas: ['Nenhuma conversa ainda', 'Toque em Escrever para falar com um amigo ou forme um Duo com alguém.'],
      amigos: ['Nenhuma conversa com amigos', 'Toque em Escrever para mandar a primeira mensagem a um amigo.'],
      matches: ['Nenhuma conversa de Duo', 'Quando você formar um Duo com alguém, a conversa aparece aqui.'],
      squads: ['Nenhum squad ainda', 'Entre em um squad na aba Jogar para conversar com o grupo.']
    };
    const pres = this.props.presence || 'online';
    const POP = {
      online: { label: 'Disponível', color: 'var(--t-green,#17C964)', desc: 'Seus duos veem a bolinha verde quando você está conectado.' },
      busy: { label: 'Ausente', color: 'var(--t-amber2,#F5A524)', desc: 'Seus duos veem que você está ausente.' },
      invisible: { label: 'Invisível', color: 'var(--t-faint,#71717A)', desc: 'Você aparece offline e continua recebendo mensagens.' }
    };
    const presenceOpts = ['online', 'busy', 'invisible'].map((k) => {
      const on = pres === k;
      return { isOnline: k === 'online', isBusy: k === 'busy', isInvis: k === 'invisible', on: on, label: POP[k].label, desc: POP[k].desc, checked: on ? 'true' : 'false', pick: () => { if (this.props.setPresence) this.props.setPresence(k); },
        radioStyle: 'flex: none; margin-top: 2px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '#E0447B' : 'var(--t-faint2,#52525B)') + ';',
        innerStyle: 'width: 10px; height: 10px; border-radius: 50%; background: ' + (on ? '#E0447B' : 'transparent') + ';' };
    });
    const ri = this.props.roomInfo || {};
    const priv = ri.privacy === 'privado';
    const friendList = this.props.friendsList || [];
    const norm2 = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const fq = norm2((this.state.fQuery || '').trim());
    const composeRows = friendList.filter((f) => !fq || norm2(f.name).indexOf(fq) >= 0 || norm2(f.handle).indexOf(fq) >= 0).map((f) => Object.assign({}, f, {
      onChat: () => { this.setState({ composeOpen: false }); if (f.openChat) f.openChat(); },
      onVisit: () => { this.setState({ composeOpen: false }); if (f.openRoom) f.openRoom(); }
    }));
    return {
      showRoomCard: !qn,
      roomImg: ri.preview || './assets/ec3a916396bc86bf20a9871bbd4b1526.png',
      roomTitle: ri.name || 'Meu quarto',
      roomPrivate: priv,
      roomOpenFlag: !priv,
      roomPrivacy: priv ? 'Privado' : 'Aberto',
      roomMeta: priv ? 'só entra com aprovação' : 'amigos podem visitar',
      query: this.state.query,
      hasQuery: this.state.query.length > 0,
      onQuery: (e) => this.setState({ query: e.target.value }),
      clearQuery: () => this.setState({ query: '' }),
      composeOpen: this.state.composeOpen,
      openCompose: () => this.setState({ composeOpen: true, fQuery: '' }),
      closeCompose: () => this.setState({ composeOpen: false }),
      openMyRoom: () => { if (this.props.openMyRoom) this.props.openMyRoom(); },
      fQuery: this.state.fQuery,
      onFQuery: (e) => this.setState({ fQuery: e.target.value }),
      composeRows: composeRows,
      noCompose: composeRows.length === 0,
      noComposeText: friendList.length === 0 ? 'Você ainda não tem amigos no Círculo. Quando seguir e for seguido de volta, eles aparecem aqui.' : 'Nenhum amigo encontrado com esse nome.',
      friendsHeader: fq ? 'Resultados' : 'Seus amigos',
      setOpen: this.state.setOpen,
      openSettings: () => this.setState({ setOpen: true }),
      closeSettings: () => this.setState({ setOpen: false }),
      presenceOpts: presenceOpts,
      presenceLabel: POP[pres].label,
      curIsOnline: pres === 'online', curIsBusy: pres === 'busy', curIsInvis: pres === 'invisible',
      presenceDotStyle: 'position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--t-card2,#212124); display: flex; align-items: center; justify-content: center;',
      goBack: () => { if (this.props.back) this.props.back(); },
      summary: (unreadTotal === 0 ? 'Tudo em dia' : (unreadTotal === 1 ? '1 conversa não lida' : unreadTotal + ' conversas não lidas')) + ' · ' + POP[pres].label,
      hasStarters: starters.length > 0,
      starters: starters,
      filterChips: [chip('todas', 'Todas', all.length + squads.length), chip('amigos', 'Amigos', friends.length), chip('matches', 'Duos', matches.length), chip('squads', 'Squads', squads.length)],
      showSquads: showSquads,
      squadRows: squads,
      showRowsHeader: showSquads && rows.length > 0,
      rows: rows.map((c) => Object.assign({}, c, {
        nameWeight: c.hasUnread ? 700 : 600,
        previewWeight: c.hasUnread ? 600 : 500,
        previewColor: c.hasUnread ? 'var(--t-text,#ECEDEE)' : 'var(--t-muted,#A1A1AA)',
        whenColor: c.hasUnread ? 'var(--t-accsoft,#8FC7FF)' : 'var(--t-faint,#71717A)',
        kindBg: c.kind === 'match' ? 'rgba(224,68,123,0.16)' : 'rgba(0,111,238,0.16)',
        kindColor: c.kind === 'match' ? 'var(--t-pink,#F38CB0)' : 'var(--t-accsoft,#8FC7FF)',
        showKind: c.kind === 'match'
      })),
      noRows: visible === 0,
      emptyTitle: qn ? 'Nenhuma conversa encontrada' : empties[filter][0],
      emptyText: qn ? 'Tente outro nome ou limpe a busca.' : empties[filter][1]
    };
  }
}
</script>
</body>
